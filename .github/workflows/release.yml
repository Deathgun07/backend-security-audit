name: Release

# On a version tag: test, attach checksums to the GitHub release, publish to npm with provenance.
# npm authentication uses Trusted Publishing (OIDC): no npm token is stored in this repository.
on:
  push:
    tags: ['v*']

permissions: read-all

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach SHA256SUMS and assets to the GitHub release
      id-token: write   # npm provenance + Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Tests
        run: bash tests/run_tests.sh && bash tests/test_cli.sh

      - name: Package and checksums
        run: |
          npm pack --silent
          sha256sum install.sh backend-security-audit-*.tgz > SHA256SUMS
          cat SHA256SUMS

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS install.sh backend-security-audit-*.tgz --clobber

      - name: Publish to npm with provenance
        run: |
          npm install -g npm@^11.5.1
          V="$(node -p 'require("./package.json").version')"
          if npm view "backend-security-audit@$V" version >/dev/null 2>&1; then
            echo "backend-security-audit@$V is already on npm, nothing to publish"; exit 0
          fi
          npm publish --provenance --access public
